<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F251D">
    <title>Refeições - Larsil</title>
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/assets/session.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--lar-fundo);
            color: var(--lar-muted);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .carregando { display: flex; align-items: center; gap: 12px; font-size: 13px; }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icone-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/icone-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icone-180.png">
</head>
<body>
    <!--
        Porta de entrada. Só decide para onde mandar a pessoa; quem autentica
        é a IAM, em /login.html. O servidor já serve login.html na raiz, então
        este arquivo só é atingido por quem tem o /index.html no atalho antigo.
    -->
    <div class="carregando">
        <span class="lar-spinner"></span>
        <span>Abrindo…</span>
    </div>

    <script>
        (function () {
            if (!SESSION.sessaoUsavel()) {
                window.location.replace('/login.html');
            } else if (!SESSION.getEquipe()) {
                window.location.replace('/escolher-equipe.html');
            } else {
                window.location.replace('/sistema-pedidos.html');
            }
        })();
    </script>
</body>
</html>
